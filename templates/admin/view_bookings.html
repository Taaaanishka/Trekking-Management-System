{% extends "base.html" %}

{% block content %}

<h1>All Bookings</h1>

<table border="1" cellpadding="8">

<tr>
    <th>Booking ID</th>
    <th>User</th>
    <th>Trek</th>
    <th>Booking Date</th>
    <th>Status</th>
</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.id }}</td>

<td>{{ booking.user.name }}</td>

<td>{{ booking.trek.trek_name }}</td>

<td>{{ booking.booking_date }}</td>

<td>{{ booking.status }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
