{% extends "base.html" %}

{% block content %}

<h2>Edit Trek</h2>

<form method="POST">

    <label>Trek Name</label><br>
    <input type="text" name="trek_name" value="{{ trek.trek_name }}"><br><br>

    <label>Location</label><br>
    <input type="text" name="location" value="{{ trek.location }}"><br><br>

    <label>Difficulty</label><br>

    <select name="difficulty">

        <option {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

        <option {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>

        <option {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

    </select>

    <br><br>

    <label>Duration</label><br>
    <input type="number" name="duration" value="{{ trek.duration }}"><br><br>

    <label>Available Slots</label><br>
    <input type="number" name="slots" value="{{ trek.available_slots }}"><br><br>

    <button type="submit">
        Update Trek
    </button>

</form>

{% endblock %}
