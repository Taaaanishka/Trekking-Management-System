<!DOCTYPE html>
<html>

<head>
    <title>Trekking Management System</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        nav{
            background:#198754;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-right:20px;
            font-weight:bold;
        }

        nav a:hover{
            text-decoration:underline;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:30px;
        }

        table{
            border-collapse:collapse;
            width:100%;
        }

        table,th,td{
            border:1px solid #ccc;
        }

        th,td{
            padding:10px;
            text-align:left;
        }

        button{
            background:#198754;
            color:white;
            border:none;
            padding:10px 18px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#146c43;
        }

    </style>

</head>

<body>

<nav>

    <a href="/">Home</a>

    <a href="/logout">
    <button>Logout</button>
</a>

    <a href="/admin/dashboard">Admin</a>

    <a href="/staff/dashboard">Staff</a>

    <a href="/user/dashboard">User</a>

</nav>

<div class="container">

{% block content %}

{% endblock %}

</div>

</body>
</html>
